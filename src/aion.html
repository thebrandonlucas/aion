<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Aion machine</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; }
    main { width: min(32rem, calc(100% - 2rem)); }
    section { padding: 1.5rem; border: 1px solid #444; border-radius: .75rem; background: #181818; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    label, input, button, a { display: block; box-sizing: border-box; width: 100%; }
    input, button, a { margin-top: .5rem; padding: .75rem; border-radius: .4rem; font: inherit; }
    input { border: 1px solid #555; background: #222; color: inherit; }
    button, a { border: 0; background: #eee; color: #111; text-align: center; font-weight: 700; cursor: pointer; }
    a { text-decoration: none; }
    button:disabled { opacity: .55; cursor: wait; }
    #checkout[hidden] { display: none; }
    code { display: block; max-height: 8rem; overflow: auto; padding: .75rem; background: #080808; overflow-wrap: anywhere; }
    .status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <main>
    <section>
      <h1>Spin up an Aion machine</h1>
      <p>Pay the 10-sat test invoice and keep this page open. Its polling starts provisioning after Everpaid confirms settlement, creating a billable DigitalOcean machine.</p>
      <form id="machine-form">
        <label for="name">Machine name</label>
        <input id="name" name="name" pattern="[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?" value="demo" required>
        <button id="create" type="submit">Create payment</button>
      </form>
      <div id="checkout" hidden>
        <p id="amount"></p>
        <a id="wallet">Open Lightning wallet</a>
        <p>Or copy this invoice:</p>
        <code id="invoice"></code>
      </div>
      <p id="status" class="status" role="status"></p>
    </section>
  </main>
  <script>
    const form = document.querySelector('#machine-form');
    const button = document.querySelector('#create');
    const status = document.querySelector('#status');
    const checkout = document.querySelector('#checkout');
    let poll;

    async function request(url, options) {
      const response = await fetch(url, options);
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || 'Request failed');
      return body;
    }

    async function watch(name) {
      try {
        let machine = await request('/api/machines/' + encodeURIComponent(name));
        if (machine.status === 'settled') {
          machine = await request('/api/machines/' + encodeURIComponent(name) + '/provision', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: '{}'
          });
        }
        status.textContent = machine.message;
        if (machine.status === 'active' || machine.status === 'failed' || machine.status === 'expired' || machine.status === 'consumed') {
          button.disabled = false;
        } else {
          poll = setTimeout(() => watch(name), 2500);
        }
      } catch (error) {
        status.textContent = error.message + '; retrying…';
        poll = setTimeout(() => watch(name), 5000);
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Creating invoice…';
      try {
        const name = form.name.value;
        const payment = await request('/api/machines', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });
        document.querySelector('#amount').textContent = payment.amountSats + ' sats';
        document.querySelector('#invoice').textContent = payment.bolt11;
        document.querySelector('#wallet').href = 'lightning:' + payment.bolt11;
        checkout.hidden = false;
        status.textContent = 'Waiting for payment…';
        clearTimeout(poll);
        poll = setTimeout(() => watch(name), 2500);
      } catch (error) {
        status.textContent = error.message;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
